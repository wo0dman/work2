<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>РИЦ · Расстановка — сменное задание</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/cyrillic-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/cyrillic-500-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/cyrillic-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/cyrillic-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/cyrillic-800-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/latin-700-normal.css">
<style>
:root{
  --bg:#F2F2F7;--card:#fff;--card2:#F7F7FA;--label:#0B0B10;--label2:rgba(60,60,67,.62);--label3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.15);--fill:rgba(118,118,128,.12);--press:rgba(0,0,0,.05);
  --hdr:rgba(242,242,247,.80);--tab:rgba(249,249,249,.88);--side:#FBFBFD;
  --blue:#007AFF;--green:#34C759;--orange:#FF9500;--pink:#FF2D55;--red:#FF3B30;--yellow:#FFCC00;
  --indigo:#5856D6;--teal:#30B0C7;--purple:#AF52DE;--gray:#8E8E93;
  --sh:0 1px 2px rgba(0,0,0,.04),0 10px 28px -14px rgba(0,0,0,.18);
  --page:#e7e9f1;
}
[data-theme=dark]{
  --bg:#000;--card:#1C1C1E;--card2:#232326;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--press:rgba(255,255,255,.08);
  --hdr:rgba(0,0,0,.72);--tab:rgba(20,20,22,.88);--side:#0d0d11;
  --blue:#0A84FF;--green:#30D158;--orange:#FF9F0A;--pink:#FF375F;--red:#FF453A;--yellow:#FFD60A;
  --indigo:#5E5CE6;--teal:#64D2FF;--purple:#BF5AF2;--gray:#98989D;
  --sh:0 1px 2px rgba(0,0,0,.6),0 14px 30px -16px rgba(0,0,0,.8);--page:#08080c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--page);color:var(--label);
  -webkit-font-smoothing:antialiased;letter-spacing:-.012em;overflow:hidden}
button{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--sep);border-radius:9px}

#app{display:grid;grid-template-columns:250px minmax(0,1fr);height:100dvh}
#sidebar{background:var(--side);border-right:.5px solid var(--sep);display:flex;flex-direction:column;padding:16px 12px;gap:14px;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 8px}
.brand .lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#0A84FF,#5E5CE6);display:grid;place-items:center;color:#fff;flex-shrink:0}
.brand b{font-size:13.5px;font-weight:800;letter-spacing:-.03em;display:block}
.brand span{font-size:11px;color:var(--label2);font-weight:500}
#navDesk{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.nv{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;border:0;background:transparent;cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--label2);text-align:left;width:100%;transition:.18s;letter-spacing:-.02em}
.nv:hover{background:var(--fill);color:var(--label)}
.nv.on{background:var(--label);color:var(--bg)}
.nv .bdg-n{margin-left:auto;font-size:10.5px;font-weight:800;background:var(--red);color:#fff;border-radius:100px;padding:1px 6px;min-width:18px;text-align:center}
.nv.on .bdg-n{background:rgba(255,255,255,.28)}
.sb-foot{display:flex;flex-direction:column;gap:8px}
.vcard{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.vcard .vr{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;margin-bottom:7px}
.vcard p{font-size:10.5px;color:var(--label2);line-height:1.45}
.tgl{display:flex;align-items:center;gap:9px;background:var(--card);border:0;border-radius:13px;padding:9px 12px;cursor:pointer;
  box-shadow:var(--sh);font-size:12px;font-weight:600;color:var(--label);width:100%;text-align:left}
.tgl .sw{margin-left:auto;width:40px;height:24px;border-radius:100px;background:var(--fill);position:relative;transition:.26s;flex-shrink:0}
.tgl .sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.26s cubic-bezier(.3,1.3,.4,1)}
.tgl .sw.on{background:var(--green)}.tgl .sw.on::after{transform:translateX(16px)}

#main{display:flex;flex-direction:column;min-width:0;position:relative;background:var(--bg)}
#topbar{position:relative;z-index:30;padding:14px 20px 11px;background:var(--hdr);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:.5px solid var(--sep);flex-shrink:0}
.tb-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
#ttl{font-size:27px;font-weight:800;letter-spacing:-.042em;line-height:1.1}
#sub{font-size:12px;font-weight:500;color:var(--label2);margin-top:4px}
.tb-r{display:flex;align-items:center;gap:8px}
.uchip{display:flex;align-items:center;gap:8px;border:0;background:var(--card);border-radius:100px;padding:4px 11px 4px 4px;
  cursor:pointer;box-shadow:var(--sh);transition:transform .18s}
.uchip:active{transform:scale(.95)}
.uchip .uav{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
.uchip .un{text-align:left;line-height:1.15}
.uchip .un b{display:block;font-size:11.5px;font-weight:700;letter-spacing:-.02em}
.uchip .un span{display:block;font-size:9.5px;color:var(--label2);font-weight:600}
.dchip{display:flex;align-items:center;gap:7px;border:0;background:var(--card);border-radius:100px;padding:7px 13px;cursor:pointer;
  box-shadow:var(--sh);font-size:12px;font-weight:700;color:var(--blue);letter-spacing:-.02em;transition:transform .18s}
.dchip:active{transform:scale(.95)}
.ibtn{width:32px;height:32px;border-radius:50%;border:0;background:var(--fill);color:var(--blue);display:grid;place-items:center;cursor:pointer;transition:transform .18s}
.ibtn:active{transform:scale(.88)}
.tb-act{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
.vpill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:6px}
.abtn{border:0;cursor:pointer;font-size:12px;font-weight:700;padding:7px 14px;border-radius:100px;background:var(--card);
  color:var(--label);box-shadow:var(--sh);display:inline-flex;align-items:center;gap:6px;transition:transform .18s,opacity .2s}
.abtn:active{transform:scale(.95)}
.abtn.pri{background:var(--blue);color:#fff}.abtn.ok{background:var(--green);color:#fff}
.abtn.dis{opacity:.35;pointer-events:none}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#view{padding:16px 20px 40px;max-width:1240px;margin:0 auto;animation:vin .34s cubic-bezier(.2,.85,.25,1)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

#tabbar{display:none;position:relative;z-index:30;height:78px;padding-bottom:20px;flex-shrink:0;background:var(--tab);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-top:.5px solid var(--sep)}
.tb{flex:1;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--label3);transition:.2s;padding-top:8px}
.tb.on{color:var(--blue)}
.tb:active{transform:scale(.88)}
.tb span{font-size:9.5px;font-weight:700;letter-spacing:-.01em}
.tb .tico{position:relative}
.tb .tbg{position:absolute;top:-3px;right:-8px;min-width:15px;height:15px;border-radius:100px;background:var(--red);color:#fff;
  font-size:9px;font-weight:800;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--tab)}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:22px 4px 8px}
.sec-h span:first-child{font-size:12px;font-weight:700;color:var(--label2);text-transform:uppercase;letter-spacing:.04em}
.sec-h span:last-child{font-size:12px;font-weight:500;color:var(--label3)}
.group{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;cursor:pointer;transition:background .15s,transform .15s}
.row:active{background:var(--press);transform:scale(.99)}
.row+.row::before{content:'';position:absolute;top:0;left:var(--inset,14px);right:0;height:.5px;background:var(--sep)}
.row.static{cursor:default}.row.static:active{transform:none;background:transparent}
.r-main{flex:1;min-width:0}
.r-title{font-size:15px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{font-size:12px;color:var(--label2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{opacity:.28;flex-shrink:0}
.av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:15px;font-weight:700;position:relative}
.av.sm{width:30px;height:30px;font-size:12px}
.av.sq{border-radius:11px;width:34px;height:34px;font-size:15px}
.sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2.5px var(--card);position:absolute;right:-1px;bottom:-1px}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:100px;white-space:nowrap;letter-spacing:-.01em}
.mchip{width:44px;height:38px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-size:14px;font-weight:800;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;background:var(--fill)}
.lk{width:18px;height:18px;border-radius:6px;background:var(--fill);display:grid;place-items:center;color:var(--label3);flex-shrink:0}
.bar{height:5px;border-radius:100px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:100px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--card);border-radius:16px;padding:13px;box-shadow:var(--sh)}
.tile .t-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;margin-bottom:9px;color:#fff}
.tile b{display:block;font-size:23px;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.tile b i{font-style:normal;font-size:13px;color:var(--label3);font-weight:700}
.tile span{display:block;font-size:11px;color:var(--label2);margin-top:5px;font-weight:500;line-height:1.3}
.hero{border-radius:22px;padding:18px;color:#fff;position:relative;overflow:hidden;box-shadow:0 16px 34px -16px rgba(50,50,160,.7)}
.hero.blue{background:linear-gradient(140deg,#0A84FF 0%,#5E5CE6 58%,#AF52DE 132%)}
.hero.dark{background:linear-gradient(140deg,#23232a,#33333f 60%,#43434f)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:2}
.hero-lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.72}
.hero-title{font-size:20px;font-weight:800;letter-spacing:-.035em;margin-top:5px;line-height:1.2}
.hero-sub{font-size:12px;opacity:.85;margin-top:4px;font-weight:500;line-height:1.4}
.ring-w{position:relative;width:66px;height:66px;flex-shrink:0}
.ring-w svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.26);stroke-width:6}
.ring-fg{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring-t{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800;letter-spacing:-.03em}
.hero-stats{display:flex;gap:8px;margin-top:15px;position:relative;z-index:2}
.hs{flex:1;background:rgba(255,255,255,.17);border-radius:13px;padding:9px 10px}
.hs b{display:block;font-size:17px;font-weight:800;letter-spacing:-.035em}
.hs span{font-size:10px;opacity:.85;font-weight:600}
.seg{position:relative;display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg-th{position:absolute;top:2px;bottom:2px;border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);
  transition:transform .3s cubic-bezier(.3,1.2,.4,1),width .3s}
[data-theme=dark] .seg-th{background:#636366;box-shadow:none}
.seg-b{position:relative;z-index:2;flex:1;border:0;background:transparent;font-size:12.5px;font-weight:700;color:var(--label2);
  padding:6px 6px;cursor:pointer;border-radius:8px;white-space:nowrap;transition:color .2s}
.seg-b.on{color:var(--label)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:0;cursor:pointer;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:100px;background:var(--card);
  color:var(--label2);box-shadow:0 0 0 .5px var(--sep);transition:.2s;display:flex;align-items:center;gap:6px}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--label);color:var(--bg)}
.chip .cd{width:7px;height:7px;border-radius:50%}
.searchbar{display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:11px;padding:8px 10px;height:38px}
.searchbar input{border:0;background:transparent;outline:0;font-family:inherit;font-size:15px;width:100%;color:var(--label)}
.searchbar input::placeholder{color:var(--label2)}
.note{display:flex;gap:10px;border-radius:14px;padding:12px 14px;align-items:flex-start}
.note p{font-size:12.5px;line-height:1.5}
.note .ic{flex-shrink:0;margin-top:1px}
.btn{border:0;cursor:pointer;font-size:14px;font-weight:700;padding:13px 18px;border-radius:14px;background:var(--blue);color:#fff;
  width:100%;transition:transform .18s,opacity .2s;letter-spacing:-.02em}
.btn:active{transform:scale(.97)}
.btn.gray{background:var(--fill);color:var(--label)}
.btn.red{background:var(--red)}
.btn.green{background:var(--green)}
.btn.dis{opacity:.35;pointer-events:none}
.empty{text-align:center;padding:46px 26px;color:var(--label2)}
.empty p{font-size:13.5px;font-weight:500;margin-top:12px}

/* ===== КАЛЕНДАРЬ ===== */
.cal{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--sh)}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.cal-hd b{font-size:14.5px;font-weight:800;letter-spacing:-.03em;text-transform:capitalize}
.cal-hd .ibtn{width:28px;height:28px}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.cal-wd span{text-align:center;font-size:9.5px;font-weight:800;color:var(--label3);text-transform:uppercase;letter-spacing:.04em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-d{border:0;background:transparent;border-radius:11px;padding:5px 2px 4px;cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:.16s}
.cal-d:hover{background:var(--fill)}
.cal-d b{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cal-d.out{opacity:.28}
.cal-d.sel{background:var(--label)}
.cal-d.sel b{color:var(--bg)}
.cal-bars{display:flex;gap:2px;width:20px}
.cal-bars i{flex:1;height:3px;border-radius:100px;display:block}
.cal-d.sel .cal-bars i{opacity:.85}
.cal-dot{position:absolute;top:3px;right:4px;width:4px;height:4px;border-radius:50%;background:var(--orange)}
.cal-d.wknd b{color:var(--red)}
.cal-d.sel.wknd b{color:var(--bg)}

.planwrap{display:flex;gap:16px;align-items:flex-start}
.planmain{flex:1;min-width:0}
.roster{width:222px;flex-shrink:0;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh);position:sticky;top:0}
.roster h5{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--label2);margin-bottom:9px}
.rst{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:10px;cursor:grab;font-size:12px;font-weight:600;
  transition:background .15s;margin-bottom:2px}
.rst:hover{background:var(--fill)}
.rst.drag{opacity:.4}
.rst .rav{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
.rst small{display:block;font-size:9.5px;color:var(--label2);font-weight:500}
.rst.off{opacity:.42;cursor:not-allowed}
.rbadge{font-size:9px;font-weight:800;padding:1px 5px;border-radius:5px;color:#fff;margin-left:auto;flex-shrink:0}
.gcard{background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.gscroll{overflow-x:auto}
table.gt{border-collapse:collapse;width:100%;min-width:740px}
table.gt th{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--label2);text-align:left;
  padding:10px 12px;border-bottom:.5px solid var(--sep);background:var(--card2);white-space:nowrap;position:sticky;top:0;z-index:2}
table.gt th.ed{color:var(--blue)}
table.gt td{font-size:12.5px;padding:7px 12px;border-bottom:.5px solid var(--sep);white-space:nowrap;vertical-align:middle}
table.gt tr.zrow td{background:var(--card2);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  color:var(--label2);padding:7px 12px}
table.gt tbody tr:hover td{background:var(--card2)}
.ced{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:4px 8px;margin:-4px -8px;transition:.16s;min-height:28px}
td.can .ced{background:rgba(0,122,255,.08);box-shadow:0 0 0 1px rgba(0,122,255,.18);cursor:pointer}
td.can .ced:hover{background:rgba(0,122,255,.16);box-shadow:0 0 0 1px rgba(0,122,255,.4)}
td.no .ced{color:var(--label2)}
td.drop{background:rgba(52,199,89,.16)!important;box-shadow:inset 0 0 0 2px var(--green)}
td.drop-bad{background:rgba(255,59,48,.14)!important;box-shadow:inset 0 0 0 2px var(--red)}
.mn{font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;max-height:90dvh;display:flex;
  flex-direction:column;transform:translateY(102%);transition:transform .42s cubic-bezier(.2,.9,.25,1);z-index:201;
  box-shadow:0 -20px 60px rgba(0,0,0,.3);border-top:.5px solid var(--sep)}
.sheet.on{transform:none}
.grab{width:36px;height:5px;border-radius:100px;background:var(--label3);margin:8px auto 0;opacity:.55;flex-shrink:0}
.sh-h{display:flex;align-items:flex-start;gap:12px;padding:12px 18px 10px;flex-shrink:0}
.sh-t{font-size:19px;font-weight:800;letter-spacing:-.038em;line-height:1.2}
.sh-s{font-size:12.5px;color:var(--label2);margin-top:3px;font-weight:500}
.sh-x{width:30px;height:30px;border-radius:50%;border:0;background:var(--fill);color:var(--label2);display:grid;place-items:center;
  cursor:pointer;margin-left:auto;flex-shrink:0}
.sh-b{overflow-y:auto;padding:0 18px 8px;flex:1;-webkit-overflow-scrolling:touch}
.sh-f{padding:10px 18px calc(18px + env(safe-area-inset-bottom));border-top:.5px solid var(--sep);display:flex;gap:9px;flex-shrink:0}
.sh-f .btn{width:auto;flex:1}
.opt{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;background:var(--card);margin-bottom:7px;
  cursor:pointer;border:2px solid transparent;transition:.16s;box-shadow:var(--sh)}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--blue)}

function schedInfo(p,ds){
  if(p.gr==='5d'){const w=wdOf(ds);return (w>=1&&w<=5)?{code:'D',shift:1}:{code:'V',shift:null}}
  const k=dayIdx(ds)+(p.off||0);
  if(p.gr==='2x2'){const cyc=Math.floor(k/4),pos=((k%4)+4)%4;
    if(pos<2){const sh=(((cyc%2)+2)%2===0)?1:2;return{code:sh===1?'D':'N',shift:sh}}
    return{code:'V',shift:null}}
  const pos=((k%4)+4)%4;
  return [{code:'D',shift:1},{code:'N',shift:2},{code:'OT',shift:null},{code:'V',shift:null}][pos];
}
function dayCode(p,ds){
  const ov=S.ovr[p.id+'_'+ds];if(ov)return ov;
  const mk=marker(p.id);
  if(mk==='vac')return 'vac';
  if(mk==='sick')return 'sick';
  if(mk==='rest')return 'V';
  return schedInfo(p,ds).code;
}
function dayShift(p,ds){return CD[dayCode(p,ds)].sh}
function isAbsent(p,ds){return ['vac','sick','OT','V'].includes(dayCode(p,ds))}
function worksShift(p,ds,sh){return dayShift(p,ds)===sh}
function brigade(pid,ds){return PEOPLE.filter(p=>dayShift(p,ds)===dayShift(P(pid),ds)&&p.z===P(pid).z&&p.id!==pid)}

function validateAssign(pid,mn,shift,ds){
  ds=ds||S.date;const p=P(pid),m=M(mn);
  if(!p||!m)return{ok:false,why:'Некорректные данные'};
  const mk=marker(pid),code=dayCode(p,ds),ci=CD[code];
  if(code==='vac')return{ok:false,why:`${p.n} в отпуске — назначение невозможно.`,hard:1};
  if(code==='sick')return{ok:false,why:`${p.n} на больничном — назначение невозможно.`,hard:1};
  if(code==='V')return{ok:false,why:`${p.n}: по графику «${GR[p.gr].s}» ${fmtD(ds)} — выходной.`,hard:1};
  if(code==='OT')return{ok:false,why:`${p.n}: ${fmtD(ds)} — отсыпной после ночной смены.`,hard:1};
  if(ci.sh&&ci.sh!==shift)return{ok:false,why:`${p.n} по графику ${fmtD(ds)} работает в ${SHIFT[ci.sh].n.toLowerCase()} смене (${SHIFT[ci.sh].t}), а не в смене ${shift}.`,hard:1};
  if(m.st==='maint')return{ok:false,why:`Станок ${mn} в состоянии «ТО / ремонт» — задания не назначаются.`,hard:1};
  const busy=assignedTo(pid,shift,ds).filter(x=>x!==mn);
  if(busy.length>=2)return{ok:false,why:`У ${p.n} уже ${busy.length} станка в этой смене (ст. ${busy.join(', ')}). Превышение нормы обслуживания.`,hard:1};
  if(mk==='cross')return{ok:true,warn:1,why:`${p.n} — подработка с другой смены. Убедитесь, что передача согласована.`};
  if(mk==='trainee'){
    const mn2=p.mentor&&P(p.mentor);
    const ok=mn2&&dayShift(mn2,ds)===shift&&assignedTo(mn2.id,shift,ds).length>0;
    if(!ok)return{ok:false,warn:1,why:`Стажёр ${p.n} назначается без наставника в смене. Наставник: ${mn2?mn2.n+' ('+(mn2?fmtD(ds)+' — '+CD[dayCode(mn2,ds)].l:'')+')':'не указан'}.`};
  }
  return{ok:true};
}

function actAssign(mn,shift,pid){

    if(!v.ok&&v.warn)return askConfirm('Назначение с предупреждением',v.why,()=>actAssign(mn,shift,pid));
    snapshot();
    const a=A(),old=a[mn][shift]?P(a[mn][shift]).n:'—';

function issues(){

    if(free.length)out.push({t:`${free.length} станк(ов) без исполнителя · ${SHIFT[sh].n.toLowerCase()} ${SHIFT[sh].t}`,
      d:'ст. '+free.map(m=>m.n).join(', '),c:'#FF9500',i:'alert',hard:0});
  });
  MACHINES.forEach(m=>[1,2].forEach(sh=>{const pid=a[m.n][sh];if(!pid)return;const p=P(pid);
    if(isAbsent(p,S.date)||dayShift(p,S.date)!==sh)
      out.push({t:`${p.n} назначен на ст. ${m}, но по графику не работает`,d:`${fmtD(S.date)} · ${CD[dayCode(p,S.date)].l} · график ${GR[p.gr].s}`,c:'#FF3B30',i:'alert',hard:1});}));
  PEOPLE.filter(p=>marker(p.id)==='trainee').forEach(p=>{
    const m=p.mentor&&P(p.mentor),sh=dayShift(p,S.date);
    if(!sh)return;
    if(!m||!assignedTo(m.id,sh,S.date).length)
      out.push({t:'Стажёр без наставника в смене',d:`${p.n} · ${SHIFT[sh].n.toLowerCase()} · наставник ${m?m.n:'не назначен'}`,c:'#FFCC00',i:'person',hard:0});
  });

  return out.slice(0,8);
}

function calHTML(mon){
  const{y,m}=parts(mon),first=new Date(y,m-1,1),sd=(first.getDay()+6)%7;
  const start=new Date(y,m-1,1-sd),total=new Date(y,m,0).getDate()+sd,weeks=Math.ceil(total/7);

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  switch(a){
    case 'go':{const v=el.dataset.v;if(v==='more'){sheetMore();return}
      S.view=v;closeSheet();render();$('#scroll').scrollTo({top:0,behavior:'smooth'});break}
    case 'more':sheetMore();break;
    case 'shift':S.shift=+el.dataset.s;if(S.view!=='schedule')render();else render();break;
    case 'gs':S.gshift=el.dataset.k==='0'?0:(el.dataset.k==='off'?'off':+el.dataset.k);render();break;
    case 'span':S.span=+el.dataset.k;render();break;
    case 'mf':S.mfilter=el.dataset.k;render();break;
    case 'mmf':S.mmf=el.dataset.k;render();break;
    case 'tf':S.tfilter=el.dataset.k;render();break;
    case 'date':sheetCalendar();break;
    case 'cal-prev':S.mon=iso(new Date(parts(S.mon).y,parts(S.mon).m-2,1));sheetCalendar();break;
    case 'cal-next':S.mon=iso(new Date(parts(S.mon).y,parts(S.mon).m,1));sheetCalendar();break;
    case 'cal-pick':{const d=el.dataset.d;S.date=d;S.mon=d;S.asgBy[d]=S.asgBy[d];A(d);save();render();closeSheet();
      toast('Версия на '+fmtD(d,'short'),'cal');break}
    case 'cal-doc':S.date=DOC_DATE;S.mon=DOC_DATE;save();render();closeSheet();toast('Версия из файла: '+fmtD(DOC_DATE),'doc');break;
    case 'pick-date':{const d=el.dataset.d;S.date=d;S.mon=d;save();render();closeSheet();
      setTimeout(()=>sheetAssignAny(el.closest('.opt')?S.__lastPerson:''),0);break}
    case 'theme':{const d=document.documentElement.dataset.theme==='dark';
      document.documentElement.dataset.theme=d?'light':'dark';try{localStorage.setItem('ric-theme',d?'light':'dark')}catch(x){}
      render();if(sheetOpen)closeSheet();break}
    case 'offline':S.offline=!S.offline;save();render();if(sheetOpen)closeSheet();
      toast(S.offline?'Офлайн-режим: правки уходят в очередь':'Онлайн: синхронизация мгновенная',S.offline?'alert':'sync');break;
    case 'sync':sync();break;
    case 'export':exportCSV();break;
    case 'reset':askConfirm('Сбросить данные','Все изменения, журнал и заявки будут удалены, расстановка вернётся к состоянию файла РАССТАНОВКА РИЦ 25.09.2026.xlsx.',()=>{
      try{localStorage.removeItem(KEY)}catch(x){}const u=S.user,th=document.documentElement.dataset.theme;load();S.user=u;
      document.documentElement.dataset.theme=th;initState();render();toast('Данные восстановлены из файла','sync')});break;
    case 'publish':actPublish();break;
    case 'todraft':if(!can('plan.publish'))return deny('plan.publish');
      ver().status='draft';log('status',`Версия ${fmtD(S.date)}`,'опубликован','черновик','');save();render();toast('Версия возвращена в черновик','edit');break;
    case 'cell':sheetCell(+el.dataset.m,+el.dataset.s);break;
    case 'person':S.__lastPerson=el.dataset.p;sheetPerson(el.dataset.p);break;
    case 'assign':actAssign(+el.dataset.m,+el.dataset.s,el.dataset.p);break;
    case 'unassign':actUnassign(+el.dataset.m,+el.dataset.s);break;
    case 'marker-open':sheetMarker(el.dataset.p);break;
    case 'marker-set':{const isC=el.dataset.mk==='cross';closeSheet();
      if(isC)setTimeout(()=>sheetCross(el.dataset.p),240);else actMarker(el.dataset.p,el.dataset.mk==='work'?null:el.dataset.mk,'');break}
    case 'cross-open':sheetCross(el.dataset.p);break;
    case 'assign-any':S.__lastPerson=el.dataset.p;sheetAssignAny(el.dataset.p);break;
    case 'sched':sheetSched(el.dataset.p,el.dataset.d);break;
    case 'sched-set':actSchedOvr(el.dataset.p,el.dataset.d,el.dataset.mk);break;
    case 'hist-p':{const p=P(el.dataset.p);sheetHist(p.n,'по работнику: '+p.n);break}
    case 'task':sheetTask(el.dataset.t);break;
    case 'task-new':sheetTaskForm(null);break;
    case 'task-edit':sheetTaskForm(el.dataset.t);break;
    case 'hist-t':{const t=S.tasks.find(x=>x.id===el.dataset.t);sheetHist(t.id,'по заданию '+t.id);break}
    case 'task-del':{const t=S.tasks.find(x=>x.id===el.dataset.t);
      askConfirm('Удалить задание',`${t.id} · ${t.t}. Запись останется в журнале (soft-delete).`,()=>{
        if(!can('task.write'))return deny('task.write');
        snapshot();S.tasks=S.tasks.filter(x=>x.id!==t.id);log('task.update',t.id,t.t,'удалено','soft-delete');
        save();render();closeSheet();toast('Задание удалено','trash',true)});break}
    case 'fact':actFact(el.dataset.t,+el.dataset.d);break;
    case 'accept':actAccept(el.dataset.t,el.dataset.ok==='1');break;
    case 'req-new':closeSheet();setTimeout(sheetReq,240);break;
    case 'rq-pick':window.__rqPick&&window.__rqPick(el.dataset.v);break;
    case 'req-ok':{const r=S.reqs.find(x=>x.id===el.dataset.id);
      askConfirm('Принять заявку',r.type+': '+r.txt+'. Правка будет внесена в черновик версии.',()=>actReqDecide(r.id,'ok',''));break}
    case 'req-no':{const r=S.reqs.find(x=>x.id===el.dataset.id);
      openSheet({t:'Отклонить заявку',s:r.id+' · '+r.type,body:`<div class="fl">Причина отказа *</div>
        <textarea class="ta" id="rj" placeholder="Например: работник уже переназначен мастером ночной смены"></textarea>`,
        foot:`<button class="btn gray" data-act="close">Отмена</button><button class="btn red" id="rjOk">Отклонить</button>`});
      $('#rjOk').onclick=()=>{const v=$('#rj').value.trim();if(v.length<4)return toast('Укажите причину','alert');actReqDecide(r.id,'no',v)};break}
    case 'login':{S.user=USERS.find(u=>u.id===el.dataset.u);S.view='overview';save();render();closeSheet();
      toast('Вход: '+S.user.n+' · '+R().n,'person');break}
    case 'undo':undo();break;
    case 'close':closeSheet();break;
    case 'hide-hint':try{localStorage.setItem('ric-hint2','1')}catch(x){}render();break;
  }
});
$('#ov').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen)closeSheet()});
let dragId=null;
document.addEventListener('dragstart',e=>{const t=e.target.closest('[data-drag]');if(!t)return;
  dragId=t.dataset.drag;t.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});
document.addEventListener('dragend',e=>{const t=e.target.closest('[data-drag]');if(t)t.classList.remove('drag');
  $$('td.drop,td.drop-bad').forEach(x=>x.classList.remove('drop','drop-bad'));dragId=null});
document.addEventListener('dragover',e=>{const c=e.target.closest('td[data-drop]');if(!c||!dragId)return;
  e.preventDefault();const[mn,sh]=c.dataset.drop.split(':').map(Number);const v=validateAssign(dragId,mn,sh);
  c.classList.toggle('drop',v.ok||v.warn);c.classList.toggle('drop-bad',!v.ok&&!v.warn)});
document.addEventListener('dragleave',e=>{const c=e.target.closest('td[data-drop]');if(c)c.classList.remove('drop','drop-bad')});
document.addEventListener('drop',e=>{const c=e.target.closest('td[data-drop]');if(!c||!dragId)return;
  e.preventDefault();const[mn,sh]=c.dataset.drop.split(':').map(Number);
  c.classList.remove('drop','drop-bad');actAssign(mn,sh,dragId)});

/* ==================== СТАРТ ==================== */
function initState(){
  S.date=DOC_DATE;S.mon=DOC_DATE;S.shift=1;S.gshift=0;S.span=7;S.q='';S.mfilter='all';S.mmf='all';S.tfilter='all';
  S.offline=false;S.queue=[];S.asgBy={};S.vers={};
  S.vers[DOC_DATE]={status:'draft',rev:4,published:null};
  A(DOC_DATE);
}
load();
try{const th=localStorage.getItem('ric-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
S.view='overview';S.asgBy=S.asgBy||{};S.vers=S.vers||{};
if(!S.vers[DOC_DATE])S.vers[DOC_DATE]={status:'draft',rev:4,published:null};
S.date=S.date||DOC_DATE;S.mon=S.mon||S.date;S.shift=S.shift||1;S.gshift=0;S.span=S.span||7;
S.q='';S.mfilter='all';S.mmf='all';S.tfilter='all';S.offline=!!S.offline;S.queue=S.queue||[];
A(S.date);
render();
</script>
</body>
