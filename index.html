<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>РИЦ · Расстановка — сменное задание</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/cyrillic-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/cyrillic-500-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/cyrillic-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/cyrillic-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/cyrillic-800-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/latin-700-normal.css">
<style>
:root{
  --bg:#F2F2F7;--card:#fff;--card2:#F7F7FA;--label:#0B0B10;--label2:rgba(60,60,67,.62);--label3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.15);--fill:rgba(118,118,128,.12);--press:rgba(0,0,0,.05);
  --hdr:rgba(242,242,247,.86);--tab:rgba(249,249,249,.9);--side:#FBFBFD;
  --blue:#007AFF;--green:#34C759;--orange:#FF9500;--pink:#FF2D55;--red:#FF3B30;--yellow:#FFCC00;
  --indigo:#5856D6;--teal:#30B0C7;--purple:#AF52DE;--gray:#8E8E93;
  --sh:0 1px 2px rgba(0,0,0,.04),0 10px 28px -14px rgba(0,0,0,.18);
  --page:#e7e9f1;--pad:20px;
}
[data-theme=dark]{
  --bg:#000;--card:#1C1C1E;--card2:#232326;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--press:rgba(255,255,255,.08);
  --hdr:rgba(0,0,0,.78);--tab:rgba(20,20,22,.9);--side:#0d0d11;
  --blue:#0A84FF;--green:#30D158;--orange:#FF9F0A;--pink:#FF375F;--red:#FF453A;--yellow:#FFD60A;
  --indigo:#5E5CE6;--teal:#64D2FF;--purple:#BF5AF2;--gray:#98989D;
  --sh:0 1px 2px rgba(0,0,0,.6),0 14px 30px -16px rgba(0,0,0,.8);--page:#08080c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--page);color:var(--label);
  -webkit-font-smoothing:antialiased;letter-spacing:-.012em;overflow:hidden}
button{font-family:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:9px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--sep);border-radius:9px}
html,body{overscroll-behavior:none}

#app{display:grid;grid-template-columns:250px minmax(0,1fr);height:100dvh}
#sidebar{background:var(--side);border-right:.5px solid var(--sep);display:flex;flex-direction:column;padding:16px 12px;gap:14px;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 8px}
.brand .lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#0A84FF,#5E5CE6);display:grid;place-items:center;color:#fff;flex-shrink:0}
.brand b{font-size:13.5px;font-weight:800;letter-spacing:-.03em;display:block}
.brand span{font-size:11px;color:var(--label2);font-weight:500}
#navDesk{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.nv{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;border:0;background:transparent;cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--label2);text-align:left;width:100%;transition:.18s;letter-spacing:-.02em}
.nv:hover{background:var(--fill);color:var(--label)}
.nv.on{background:var(--label);color:var(--bg)}
.nv .kbd{margin-left:auto;font-size:9.5px;font-weight:700;opacity:.4;font-variant-numeric:tabular-nums}
.nv .bdg-n{margin-left:auto;font-size:10.5px;font-weight:800;background:var(--red);color:#fff;border-radius:100px;padding:1px 6px;min-width:18px;text-align:center}
.nv.on .bdg-n{background:rgba(255,255,255,.28)}
.sb-foot{display:flex;flex-direction:column;gap:8px}
.vcard{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.vcard .vr{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;margin-bottom:7px}
.vcard p{font-size:10.5px;color:var(--label2);line-height:1.45}
.tgl{display:flex;align-items:center;gap:9px;background:var(--card);border:0;border-radius:13px;padding:9px 12px;cursor:pointer;
  box-shadow:var(--sh);font-size:12px;font-weight:600;color:var(--label);width:100%;text-align:left}
.tgl .sw{margin-left:auto;width:40px;height:24px;border-radius:100px;background:var(--fill);position:relative;transition:.26s;flex-shrink:0}
.tgl .sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.26s cubic-bezier(.3,1.3,.4,1)}
.tgl .sw.on{background:var(--green)}.tgl .sw.on::after{transform:translateX(16px)}

#main{display:flex;flex-direction:column;min-width:0;position:relative;background:var(--bg)}
#topbar{position:relative;z-index:30;padding:12px var(--pad) 10px;background:var(--hdr);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:.5px solid var(--sep);flex-shrink:0}
.tb-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tb-l{display:flex;align-items:center;gap:4px;min-width:0}
.back{display:inline-flex;align-items:center;border:0;background:transparent;color:var(--blue);cursor:pointer;padding:8px 6px;
  border-radius:9px;flex-shrink:0;margin-left:-6px;transition:transform .18s}
.back:active{transform:translateX(-3px) scale(.94)}
#ttl{font-size:26px;font-weight:800;letter-spacing:-.042em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{font-size:11.5px;font-weight:500;color:var(--label2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-r{display:flex;align-items:center;gap:7px;flex-shrink:0}
.dstep{display:flex;align-items:center;background:var(--card);border-radius:100px;padding:3px;box-shadow:var(--sh)}
.dstep button{width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:var(--blue);cursor:pointer;
  display:grid;place-items:center;transition:background .15s,transform .15s}
.dstep button:hover{background:var(--fill)}
.dstep button:active{transform:scale(.86)}
.dstep .dv{font-size:12px;font-weight:800;padding:0 7px;cursor:pointer;letter-spacing:-.03em;white-space:nowrap;
  font-variant-numeric:tabular-nums;border:0;background:transparent;color:var(--label);font-family:inherit}
.uchip{display:flex;align-items:center;gap:8px;border:0;background:var(--card);border-radius:100px;padding:4px 11px 4px 4px;
  cursor:pointer;box-shadow:var(--sh);transition:transform .18s}
.uchip:active{transform:scale(.95)}
.uchip .uav{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
.uchip .un{text-align:left;line-height:1.15}
.uchip .un b{display:block;font-size:11.5px;font-weight:700;letter-spacing:-.02em}
.uchip .un span{display:block;font-size:9.5px;color:var(--label2);font-weight:600}
.ibtn{width:32px;height:32px;border-radius:50%;border:0;background:var(--fill);color:var(--blue);display:grid;place-items:center;cursor:pointer;transition:transform .18s}
.ibtn:active{transform:scale(.88)}
.tb-act{display:flex;align-items:center;gap:7px;margin-top:10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.tb-act::-webkit-scrollbar{display:none}
.vpill{font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:8px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0}
.abtn{border:0;cursor:pointer;font-size:11.5px;font-weight:700;padding:7px 13px;border-radius:100px;background:var(--card);
  color:var(--label);box-shadow:var(--sh);display:inline-flex;align-items:center;gap:6px;transition:transform .18s,opacity .2s;white-space:nowrap;flex-shrink:0}
.abtn:active{transform:scale(.95)}
.abtn.pri{background:var(--blue);color:#fff}.abtn.ok{background:var(--green);color:#fff}
.abtn.dis{opacity:.35;pointer-events:none}
.spacer{margin-left:auto;flex-shrink:0}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;position:relative}
#view{padding:14px var(--pad) 46px;max-width:1240px;margin:0 auto;will-change:transform,opacity}
#view.fwd{animation:vinR .32s cubic-bezier(.2,.85,.25,1)}
#view.bwd{animation:vinL .32s cubic-bezier(.2,.85,.25,1)}
@keyframes vinR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes vinL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.ptr{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;background:var(--card);
  box-shadow:var(--sh);display:grid;place-items:center;color:var(--blue);opacity:0;transition:opacity .2s;z-index:5}
.ptr.on{opacity:1}
.ptr.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#tabbar{display:none;position:relative;z-index:30;height:76px;padding-bottom:18px;flex-shrink:0;background:var(--tab);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-top:.5px solid var(--sep)}
.tb{flex:1;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--label3);transition:.2s;padding-top:8px}
.tb.on{color:var(--blue)}
.tb:active{transform:scale(.88)}
.tb span{font-size:9.5px;font-weight:700;letter-spacing:-.01em}
.tb .tico{position:relative}
.tb .tbg{position:absolute;top:-3px;right:-8px;min-width:15px;height:15px;border-radius:100px;background:var(--red);color:#fff;
  font-size:9px;font-weight:800;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--tab)}

/* плавающие кнопки */
.fab{position:absolute;right:16px;bottom:94px;z-index:40;height:48px;border-radius:100px;border:0;cursor:pointer;
  background:var(--blue);color:#fff;font-family:inherit;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;
  padding:0 17px;box-shadow:0 12px 28px -8px rgba(0,122,255,.75);transition:transform .32s cubic-bezier(.2,1,.3,1),opacity .25s;
  letter-spacing:-.02em}
.fab.hide{transform:translateY(90px) scale(.85);opacity:0;pointer-events:none}
.fab:active{transform:scale(.93)}
.totop{position:absolute;right:18px;bottom:94px;z-index:39;width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;
  background:var(--card);color:var(--blue);display:grid;place-items:center;box-shadow:var(--sh);opacity:0;pointer-events:none;
  transform:translateY(12px);transition:.28s}
.totop.on{opacity:1;pointer-events:auto;transform:none}
.hasfab .totop{bottom:152px}

/* липкая панель фильтров */
.sbar{position:sticky;top:0;z-index:20;margin:0 calc(var(--pad)*-1) 12px;padding:9px var(--pad) 9px;
  background:var(--hdr);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid transparent;transition:border-color .22s}
.sbar.stuck{border-bottom-color:var(--sep)}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:22px 4px 8px}
.sec-h span:first-child{font-size:12px;font-weight:700;color:var(--label2);text-transform:uppercase;letter-spacing:.04em}
.sec-h span:last-child{font-size:12px;font-weight:500;color:var(--label3)}
.group{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;cursor:pointer;transition:background .15s,transform .15s}
.row:active{background:var(--press)}
.row+.row::before{content:'';position:absolute;top:0;left:var(--inset,14px);right:0;height:.5px;background:var(--sep)}
.row.static{cursor:default}.row.static:active{background:transparent}
.row.nosep::before{display:none!important}
.r-main{flex:1;min-width:0}
.r-title{font-size:15px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{font-size:12px;color:var(--label2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{opacity:.28;flex-shrink:0}
.av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:15px;font-weight:700;position:relative}
.av.sm{width:30px;height:30px;font-size:12px}
.av.sq{border-radius:11px;width:34px;height:34px;font-size:15px}
.sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2.5px var(--card);position:absolute;right:-1px;bottom:-1px}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:100px;white-space:nowrap;letter-spacing:-.01em}
.mchip{width:44px;height:38px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-size:14px;font-weight:800;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;background:var(--fill)}
.lk{width:18px;height:18px;border-radius:6px;background:var(--fill);display:grid;place-items:center;color:var(--label3);flex-shrink:0}
.bar{height:5px;border-radius:100px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:100px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--card);border-radius:16px;padding:13px;box-shadow:var(--sh);cursor:pointer;transition:transform .18s}
.tile:active{transform:scale(.97)}
.tile .t-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;margin-bottom:9px;color:#fff}
.tile b{display:block;font-size:23px;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.tile b i{font-style:normal;font-size:13px;color:var(--label3);font-weight:700}
.tile span{display:block;font-size:11px;color:var(--label2);margin-top:5px;font-weight:500;line-height:1.3}
.hero{border-radius:22px;padding:18px;color:#fff;position:relative;overflow:hidden;box-shadow:0 16px 34px -16px rgba(50,50,160,.7)}
.hero.blue{background:linear-gradient(140deg,#0A84FF 0%,#5E5CE6 58%,#AF52DE 132%)}
.hero.dark{background:linear-gradient(140deg,#23232a,#33333f 60%,#43434f)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:2}
.hero-lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.72}
.hero-title{font-size:20px;font-weight:800;letter-spacing:-.035em;margin-top:5px;line-height:1.2}
.hero-sub{font-size:12px;opacity:.85;margin-top:4px;font-weight:500;line-height:1.4}
.ring-w{position:relative;width:66px;height:66px;flex-shrink:0}
.ring-w svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.26);stroke-width:6}
.ring-fg{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring-t{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800;letter-spacing:-.03em}
.hero-stats{display:flex;gap:8px;margin-top:15px;position:relative;z-index:2}
.hs{flex:1;background:rgba(255,255,255,.17);border-radius:13px;padding:9px 10px;cursor:pointer}
.hs:active{transform:scale(.97)}
.hs b{display:block;font-size:17px;font-weight:800;letter-spacing:-.035em}
.hs span{font-size:10px;opacity:.85;font-weight:600}
.seg{position:relative;display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg-th{position:absolute;top:2px;bottom:2px;border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);
  transition:transform .3s cubic-bezier(.3,1.2,.4,1),width .3s}
[data-theme=dark] .seg-th{background:#636366;box-shadow:none}
.seg-b{position:relative;z-index:2;flex:1;border:0;background:transparent;font-size:12.5px;font-weight:700;color:var(--label2);
  padding:7px 6px;cursor:pointer;border-radius:8px;white-space:nowrap;transition:color .2s}
.seg-b.on{color:var(--label)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:0;cursor:pointer;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:100px;background:var(--card);
  color:var(--label2);box-shadow:0 0 0 .5px var(--sep);transition:.2s;display:flex;align-items:center;gap:6px;scroll-snap-align:start}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--label);color:var(--bg)}
.chip .cd{width:7px;height:7px;border-radius:50%}
.searchbar{display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:11px;padding:8px 10px;height:38px}
.searchbar input{border:0;background:transparent;outline:0;font-family:inherit;font-size:15px;width:100%;color:var(--label)}
.searchbar input::placeholder{color:var(--label2)}
.note{display:flex;gap:10px;border-radius:14px;padding:12px 14px;align-items:flex-start}
.note p{font-size:12.5px;line-height:1.5}
.note .ic{flex-shrink:0;margin-top:1px}
.btn{border:0;cursor:pointer;font-size:14px;font-weight:700;padding:13px 18px;border-radius:14px;background:var(--blue);color:#fff;
  width:100%;transition:transform .18s,opacity .2s;letter-spacing:-.02em;min-height:46px}
.btn:active{transform:scale(.97)}
.btn.gray{background:var(--fill);color:var(--label)}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}
.btn.dis{opacity:.35;pointer-events:none}
.empty{text-align:center;padding:46px 26px;color:var(--label2)}
.empty p{font-size:13.5px;font-weight:500;margin-top:12px}
.empty .eb{margin-top:16px;max-width:250px;margin-left:auto;margin-right:auto}

/* календарь */
.cal{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--sh)}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.cal-hd b{font-size:14.5px;font-weight:800;letter-spacing:-.03em;text-transform:capitalize}
.cal-hd .ibtn{width:30px;height:30px}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.cal-wd span{text-align:center;font-size:9.5px;font-weight:800;color:var(--label3);text-transform:uppercase;letter-spacing:.04em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-d{border:0;background:transparent;border-radius:11px;padding:5px 2px 4px;cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:.16s;min-height:44px}
.cal-d:hover{background:var(--fill)}
.cal-d:active{transform:scale(.93)}
.cal-d b{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cal-d.out{opacity:.28}
.cal-d.sel{background:var(--label)}
.cal-d.sel b{color:var(--bg)}
.cal-bars{display:flex;gap:2px;width:20px}
.cal-bars i{flex:1;height:3px;border-radius:100px;display:block}
.cal-dot{position:absolute;top:3px;right:4px;width:4px;height:4px;border-radius:50%;background:var(--orange)}
.cal-d.wknd b{color:var(--red)}
.cal-d.sel.wknd b{color:var(--bg)}

.planwrap{display:flex;gap:16px;align-items:flex-start}
.planmain{flex:1;min-width:0}
.roster{width:224px;flex-shrink:0;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh);position:sticky;top:0;
  max-height:calc(100dvh - 200px);overflow-y:auto}
.roster h5{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--label2);margin-bottom:9px}
.rst{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:10px;cursor:grab;font-size:12px;font-weight:600;
  transition:background .15s;margin-bottom:2px}
.rst:hover{background:var(--fill)}
.rst.drag{opacity:.4}
.rst .rav{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0}
.rst small{display:block;font-size:9.5px;color:var(--label2);font-weight:500}
.rst.off{opacity:.42;cursor:not-allowed}
.rbadge{font-size:9px;font-weight:800;padding:1px 5px;border-radius:5px;color:#fff;margin-left:auto;flex-shrink:0}

/* горизонтальный скролл с подсказкой */
.hwrap{position:relative}
.hwrap::after{content:'';position:absolute;top:0;right:0;bottom:0;width:30px;pointer-events:none;opacity:0;transition:.25s;
  background:linear-gradient(90deg,transparent,var(--card))}
.hwrap.more::after{opacity:1}
.gcard{background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.gscroll{overflow-x:auto;cursor:grab;scroll-behavior:auto}
.gscroll.drag{cursor:grabbing;scroll-behavior:auto;user-select:none}
table.gt{border-collapse:collapse;width:100%;min-width:760px}
table.gt th{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.045em;color:var(--label2);text-align:left;
  padding:10px 12px;border-bottom:.5px solid var(--sep);background:var(--card2);white-space:nowrap;position:sticky;top:0;z-index:2}
table.gt th.ed{color:var(--blue)}
table.gt td{font-size:12.5px;padding:7px 12px;border-bottom:.5px solid var(--sep);white-space:nowrap;vertical-align:middle}
table.gt tr.zrow td{background:var(--card2);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  color:var(--label2);padding:7px 12px}
table.gt tbody tr:hover td{background:var(--card2)}
.ced{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:4px 8px;margin:-4px -8px;transition:.16s;min-height:30px}
td.can .ced{background:rgba(0,122,255,.08);box-shadow:0 0 0 1px rgba(0,122,255,.18);cursor:pointer}
td.can .ced:hover{background:rgba(0,122,255,.16);box-shadow:0 0 0 1px rgba(0,122,255,.4)}
td.no .ced{color:var(--label2)}
td.drop{background:rgba(52,199,89,.16)!important;box-shadow:inset 0 0 0 2px var(--green)}
td.drop-bad{background:rgba(255,59,48,.14)!important;box-shadow:inset 0 0 0 2px var(--red)}
.mn{font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* swipe-строки */
.sw{position:relative;overflow:hidden;background:var(--card)}
.sw+.sw::before{content:'';position:absolute;top:0;left:var(--inset,14px);right:0;height:.5px;background:var(--sep);z-index:4}
.sw-in{position:relative;z-index:2;background:var(--card);will-change:transform}
.sw-act{position:absolute;top:0;bottom:0;right:0;display:flex;z-index:1}
.sw-act button{border:0;width:78px;font-family:inherit;font-size:11px;font-weight:700;color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;cursor:pointer;letter-spacing:-.01em}

/* контекстное меню */
.ctx{position:fixed;z-index:250;background:var(--card);border-radius:14px;box-shadow:0 20px 54px rgba(0,0,0,.34),0 0 0 .5px var(--sep);
  padding:5px;min-width:224px;transform-origin:top left;animation:ctxin .16s cubic-bezier(.2,1,.3,1);max-height:70vh;overflow-y:auto}
@keyframes ctxin{from{opacity:0;transform:scale(.94)}}
.ctx button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:10px;
  font-family:inherit;font-size:13px;font-weight:600;color:var(--label);cursor:pointer;text-align:left;letter-spacing:-.015em}
.ctx button:hover,.ctx button.hl{background:var(--blue);color:#fff}
.ctx button.danger:hover{background:var(--red)}
.ctx button small{margin-left:auto;font-size:10px;opacity:.55;font-weight:600}
.ctx hr{border:0;border-top:.5px solid var(--sep);margin:4px 8px}
.ctx .ch{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--label3);padding:7px 10px 4px}

/* командная палитра */
.cmdk{position:fixed;inset:0;z-index:260;background:rgba(0,0,0,.36);display:flex;justify-content:center;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fadin .18s}
@keyframes fadin{from{opacity:0}}
.cmdk-box{width:min(640px,94vw);max-height:66vh;background:var(--card);border-radius:18px;overflow:hidden;margin-top:11vh;
  box-shadow:0 30px 80px rgba(0,0,0,.45);display:flex;flex-direction:column;animation:cmdin .26s cubic-bezier(.2,1,.3,1)}
@keyframes cmdin{from{opacity:0;transform:translateY(-14px) scale(.98)}}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:.5px solid var(--sep)}
.cmdk-in input{flex:1;border:0;outline:0;background:transparent;font-family:inherit;font-size:16.5px;color:var(--label);font-weight:600;letter-spacing:-.02em}
.cmdk-list{overflow-y:auto;padding:6px}
.cmdk-g{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--label3);padding:9px 10px 5px}
.cmdk-i{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:11px;cursor:pointer}
.cmdk-i .ci{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;color:#fff}
.cmdk-i b{font-size:13.5px;font-weight:600;letter-spacing:-.02em;display:block}
.cmdk-i small{font-size:11px;color:var(--label2);font-weight:500}
.cmdk-i.sel{background:var(--blue)}
.cmdk-i.sel b,.cmdk-i.sel small{color:#fff}
.cmdk-f{padding:9px 14px;border-top:.5px solid var(--sep);font-size:11px;color:var(--label3);display:flex;gap:14px;flex-wrap:wrap}
kbd{font-family:inherit;font-size:10px;font-weight:800;background:var(--fill);border-radius:5px;padding:2px 6px;color:var(--label2)}

/* коуч-тур */
.coach-hole{position:fixed;z-index:281;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.58);pointer-events:none;
  transition:all .38s cubic-bezier(.2,.9,.25,1)}
.coach-card{position:fixed;z-index:282;width:min(330px,88vw);background:var(--card);border-radius:20px;padding:18px;
  box-shadow:0 26px 64px rgba(0,0,0,.5);transition:all .38s cubic-bezier(.2,.9,.25,1)}
.coach-card .cc-n{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);margin-bottom:7px}
.coach-card b{font-size:17px;font-weight:800;letter-spacing:-.035em;display:block;margin-bottom:7px;line-height:1.25}
.coach-card p{font-size:13px;color:var(--label2);line-height:1.55}
.coach-f{display:flex;gap:9px;margin-top:15px;align-items:center}
.coach-dots{display:flex;gap:5px;margin-right:auto}
.coach-dots i{width:6px;height:6px;border-radius:50%;background:var(--fill)}
.coach-dots i.on{background:var(--blue);width:16px;border-radius:100px}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--fill) 25%,var(--card2) 37%,var(--fill) 63%);background-size:400% 100%;
  animation:sk 1.1s ease infinite;border-radius:12px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* sheet */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;max-height:92dvh;display:flex;
  flex-direction:column;transform:translateY(102%);transition:transform .42s cubic-bezier(.2,.9,.25,1);z-index:201;
  box-shadow:0 -20px 60px rgba(0,0,0,.3);border-top:.5px solid var(--sep);overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:36px;height:5px;border-radius:100px;background:var(--label3);margin:8px auto 0;opacity:.55;flex-shrink:0;cursor:grab}
.sh-h{display:flex;align-items:flex-start;gap:10px;padding:10px 16px 9px;flex-shrink:0;cursor:grab}
.sh-t{font-size:19px;font-weight:800;letter-spacing:-.038em;line-height:1.2}
.sh-s{font-size:12.5px;color:var(--label2);margin-top:3px;font-weight:500}
.sh-back{width:30px;height:30px;border-radius:50%;border:0;background:var(--fill);color:var(--blue);display:grid;place-items:center;
  cursor:pointer;flex-shrink:0;margin-top:2px}
.sh-x{width:30px;height:30px;border-radius:50%;border:0;background:var(--fill);color:var(--label2);display:grid;place-items:center;
  cursor:pointer;margin-left:auto;flex-shrink:0}
.sh-b{overflow-y:auto;padding:0 18px 10px;flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-f{padding:10px 18px calc(14px + env(safe-area-inset-bottom));border-top:.5px solid var(--sep);display:flex;gap:9px;flex-shrink:0;
  background:var(--bg)}
.sh-f .btn{width:auto;flex:1}
.opt{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;background:var(--card);margin-bottom:7px;
  cursor:pointer;border:2px solid transparent;transition:.16s;box-shadow:var(--sh);min-height:48px}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--blue)}
.opt.dis{opacity:.4;cursor:not-allowed}
.opt.rec{border-color:rgba(52,199,89,.5)}
.opt .ot{flex:1;min-width:0}
.opt b{font-size:14px;font-weight:600;letter-spacing:-.02em;display:block}
.opt small{font-size:11.5px;color:var(--label2);display:block;margin-top:1px;line-height:1.4}
.sw-mk{width:22px;height:22px;border-radius:7px;flex-shrink:0}
.ta{width:100%;border:0;background:var(--card);border-radius:13px;padding:12px;font-family:inherit;font-size:14px;color:var(--label);
  resize:vertical;min-height:78px;outline:0;box-shadow:var(--sh);line-height:1.5}
.inp{width:100%;border:0;background:var(--card);border-radius:12px;padding:11px 13px;font-family:inherit;font-size:15px;
  color:var(--label);outline:0;box-shadow:var(--sh);min-height:44px}
select.inp{appearance:none}
.fl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--label2);margin:14px 2px 7px;
  display:flex;align-items:center;justify-content:space-between}
.stepper{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:12px;padding:5px;box-shadow:var(--sh)}
.stepper button{width:40px;height:38px;border:0;border-radius:9px;background:var(--fill);color:var(--blue);font-size:19px;
  font-weight:700;cursor:pointer;display:grid;place-items:center}
.stepper input{flex:1;border:0;background:transparent;text-align:center;font-family:inherit;font-size:16px;font-weight:700;
  color:var(--label);outline:0;width:50px}

.tcard{background:var(--card);border-radius:17px;padding:14px;box-shadow:var(--sh);margin-bottom:10px;cursor:pointer;transition:transform .16s}
.tcard:active{transform:scale(.985)}
.tc-top{display:flex;gap:11px;align-items:flex-start}
.prio{width:3px;border-radius:100px;align-self:stretch;min-height:36px;flex-shrink:0}
.tcard h4{font-size:14.5px;font-weight:700;letter-spacing:-.025em;line-height:1.3}
.tmeta{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.tagz{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:7px;display:inline-flex;align-items:center;gap:5px}
.tm{font-size:11px;color:var(--label2);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.tprog{display:flex;align-items:center;gap:10px;margin-top:12px}
.tprog .bar{flex:1}
.tprog b{font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}

.aud{display:flex;gap:11px;padding:11px 14px;position:relative}
.aud+.aud::before{content:'';position:absolute;top:0;left:47px;right:0;height:.5px;background:var(--sep)}
.aud .aic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;color:#fff}
.aud b{font-size:13px;font-weight:700;letter-spacing:-.02em;display:block}
.aud p{font-size:11.5px;color:var(--label2);margin-top:2px;line-height:1.45}
.aud .diff{font-size:11.5px;margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.aud .old{color:var(--red);text-decoration:line-through}
.aud .new{color:var(--green);font-weight:700}
.aud time{font-size:10px;color:var(--label3);font-weight:600;margin-left:auto;flex-shrink:0}

.scard{background:var(--card);border-radius:17px;padding:13px 0;box-shadow:var(--sh);overflow:hidden}
.sscroll{overflow-x:auto;scrollbar-width:none;cursor:grab;overscroll-behavior-x:contain}
.sscroll::-webkit-scrollbar{display:none}
.sscroll.drag{cursor:grabbing}
table.sch{border-collapse:separate;border-spacing:0 3px;width:100%}
table.sch .dh{font-size:9.5px;font-weight:700;color:var(--label2);text-align:center;padding-bottom:6px;line-height:1.3;min-width:36px}
table.sch .dh b{display:block;font-size:11.5px;color:var(--label);font-variant-numeric:tabular-nums}
table.sch .dh.td b,table.sch .dh.td{color:var(--blue)}
table.sch .nm{position:sticky;left:0;background:var(--card);z-index:2;padding:0 8px 0 13px;width:120px;text-align:left}
table.sch .nm div{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.sch .nm small{font-size:9.5px;color:var(--label2);font-weight:500;display:block}
table.sch td.c{padding:0 2px}
.sc{height:34px;border-radius:10px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;cursor:pointer;
  transition:transform .15s;letter-spacing:-.02em}
.sc:active{transform:scale(.9)}
.sc.tdw{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--blue)}
.lgd{display:flex;flex-direction:column}
.lgr{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:13px;position:relative}
.lgr+.lgr::before{content:'';position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--sep)}
.lgr .sw-mk{width:16px;height:16px;border-radius:5px}
.lgr b{font-weight:600}.lgr span{color:var(--label2);font-size:11.5px;margin-left:auto;text-align:right}

#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,140px);background:var(--label);color:var(--bg);border-radius:15px;
  padding:12px 16px;display:flex;align-items:center;gap:11px;font-size:13px;font-weight:600;z-index:300;max-width:calc(100vw - 28px);
  box-shadow:0 16px 40px rgba(0,0,0,.35);transition:transform .42s cubic-bezier(.2,1.1,.3,1);letter-spacing:-.02em}
#toast.on{transform:translate(-50%,0)}
#toast b{color:var(--blue);font-weight:800;cursor:pointer;flex-shrink:0}
[data-theme=dark] #toast b{color:#64D2FF}
#toast .ti{flex-shrink:0}

.hint{background:linear-gradient(135deg,rgba(0,122,255,.10),rgba(88,86,214,.10));border-radius:16px;padding:14px;display:flex;gap:12px;
  align-items:flex-start;margin-bottom:14px;border:.5px solid rgba(0,122,255,.18)}
.hint p{font-size:12.5px;line-height:1.5;color:var(--label)}
.hint b{font-weight:800}
.hint .hx{margin-left:auto;background:var(--fill);border:0;border-radius:50%;width:24px;height:24px;cursor:pointer;color:var(--label2);
  display:grid;place-items:center;flex-shrink:0}
.grb{font-size:10px;font-weight:800;padding:2.5px 7px;border-radius:6px;letter-spacing:-.01em;white-space:nowrap}
.rec-b{font-size:9.5px;font-weight:800;padding:2.5px 7px;border-radius:100px;background:rgba(52,199,89,.16);color:var(--green);white-space:nowrap}

@media(max-width:899px){
  :root{--pad:16px}
  #app{grid-template-columns:1fr}
  #sidebar{display:none}
  #tabbar{display:flex}
  #topbar{padding:10px 14px 9px}
  #ttl{font-size:22px}
  .uchip .un{display:none}
  .uchip{padding:4px}
  .hide-m{display:none!important}
  .planwrap{flex-direction:column}
  .roster{display:none}
  .fab{bottom:92px}.totop{bottom:92px}.hasfab .totop{bottom:150px}
}
@media(max-width:420px){.hero-title{font-size:18px}.tile b{font-size:20px}.dstep .dv{font-size:11px;padding:0 5px}}
@media(min-width:900px){.fab{bottom:26px}.totop{bottom:26px}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="lg"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2.4"/><path d="M10 2.5v3M14 2.5v3M10 18.5v3M14 18.5v3M2.5 10h3M2.5 14h3M18.5 10h3M18.5 14h3"/></svg></div>
      <div><b>РИЦ · Расстановка</b><span>Сменное задание участка</span></div>
    </div>
    <nav id="navDesk"></nav>
    <div class="sb-foot">
      <div class="vcard" id="verCard"></div>
      <button class="tgl" data-act="cmdk"><span style="color:var(--label3);display:flex"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></span>Поиск и команды<span style="margin-left:auto"><kbd>⌘K</kbd></span></button>
      <button class="tgl" data-act="offline"><span id="offIc"></span>Офлайн-режим<span class="sw" id="offSw"></span></button>
      <button class="tgl" data-act="theme"><span id="thIc"></span>Тёмная тема<span class="sw" id="thSw"></span></button>
      <button class="tgl" data-act="tour"><span style="color:var(--label3);display:flex"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg></span>Подсказки по интерфейсу</button>
    </div>
  </aside>

  <div id="main">
    <header id="topbar">
      <div class="tb-row">
        <div class="tb-l">
          <button class="back" id="backBtn" data-act="back" style="display:none" aria-label="Назад">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
          </button>
          <div style="min-width:0"><h1 id="ttl">Обзор</h1><p id="sub"></p></div>
        </div>
        <div class="tb-r">
          <div class="dstep">
            <button data-act="day" data-d="-1" aria-label="Предыдущий день"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
            <button class="dv" data-act="date" id="dateChip">25.09</button>
            <button data-act="day" data-d="1" aria-label="Следующий день"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(180deg)"><path d="m15 5-7 7 7 7"/></svg></button>
          </div>
          <button class="uchip" data-act="login-sheet" id="uchip"></button>
          <button class="ibtn" data-act="theme" id="themeBtn" aria-label="Тема"></button>
        </div>
      </div>
      <div class="tb-act" id="tbAct"></div>
    </header>
    <div id="scroll">
      <div class="ptr" id="ptr"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></div>
      <main id="view"></main>
    </div>
    <button class="totop" id="totop" data-act="totop" aria-label="Наверх"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    <button class="fab hide" id="fab"></button>
    <nav id="tabbar"></nav>
  </div>
</div>

<div id="ov" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab" id="grab"></div>
  <div class="sh-h" id="shHead">
    <button class="sh-back" id="shBack" data-act="sheet-back" style="display:none" aria-label="Назад"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
    <div style="flex:1;min-width:0"><div class="sh-t" id="shT"></div><div class="sh-s" id="shS"></div></div>
    <button class="sh-x" data-act="close" aria-label="Закрыт­ь"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="sh-b" id="shB"></div>
  <div class="sh-f" id="shF"></div>
</div>
<div id="toast"></div>

<script>

function iso(d){const x=(d instanceof Date)?d:new Date(String(d).slice(0,10)+'T00:00:00');
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function addD(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)}
function parts(ds){const[a,b,c]=String(ds).split('-').map(Number);return{y:a,m:b,d:c}}
const EPOCH=Date.UTC(2026,8,1);
function dayIdx(ds){const{y,m,d}=parts(ds);return Math.round((Date.UTC(y,m-1,d)-EPOCH)/86400000)}
function wdOf(ds){return new Date(ds+'T00:00:00').getDay()}
function fmtD(ds,f){const{y,m,d}=parts(ds);const dt=new Date(y,m-1,d);
  if(f==='full')return dt.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if(f==='short')return dt.toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'});
  if(f==='dm')return String(d).padStart(2,'0')+'.'+String(m).padStart(2,'0');
  return String(d).padStart(2,'0')+'.'+String(m).padStart(2,'0')+'.'+y}

  if(p.gr==='5d'){const w=wdOf(ds);return (w>=1&&w<=5)?{code:'D',shift:1}:{code:'V',shift:null}}

function validateAssign(pid,mn,shift,ds){
  ds=ds||S.date;const p=P(pid),m=M(mn);
  if(!p||!m)return{ok:false,why:'Некорректные данные'};
  const mk=marker(pid),code=dayCode(p,ds),ci=CD[code];
  if(code==='vac')return{ok:false,why:`${p.n} в отпуске — назначение невозможно.`,hard:1};
  if(code==='sick')return{ok:false,why:`${p.n} на больничном — назначение невозможно.`,hard:1};
  if(code==='V')return{ok:false,why:`${p.n}: по графику «${GR[p.gr].s}» ${fmtD(ds,'dm')} — выходной.`,hard:1};
  if(code==='OT')return{ok:false,why:`${p.n}: ${fmtD(ds,'dm')} — отсыпной после ночной смены.`,hard:1};
  if(ci.sh&&ci.sh!==shift)return{ok:false,why:`${p.n} по графику ${fmtD(ds,'dm')} работает в ${SHIFT[ci.sh].n.toLowerCase()} смене (${SHIFT[ci.sh].t}).`,hard:1};
  if(m.st==='maint')return{ok:false,why:`Станок ${mn} в состоянии «ТО / ремонт» — задания не назначаются.`,hard:1};
  const busy=assignedTo(pid,shift,ds).filter(x=>x!==mn);
  if(busy.length>=2)return{ok:false,why:`У ${p.n} уже ${busy.length} станка в этой смене (ст. ${busy.join(', ')}). Превышение нормы обслуживания.`,hard:1};
  if(mk==='cross')return{ok:true,warn:1,why:`${p.n} — подработка с другой смены. Убедитесь, что передача согласована.`};
  if(mk==='trainee'){
    const mt=p.mentor&&P(p.mentor);
    const ok=mt&&dayShift(mt,ds)===shift&&assignedTo(mt.id,shift,ds).length>0;
    if(!ok)return{ok:false,warn:1,why:`Стажёр ${p.n} назначается без наставника в смене. Наставник: ${mt?mt.n:'не указан'}.`};

  return{ok:true};
}

let swOpen=null,suppress=false;
function initSwipe(){
  if(isDesktop())return;
  $$('#view .sw').forEach(el=>{
    const inner=el.querySelector('.sw-in'),act=el.querySelector('.sw-act');
    if(!act)return;
    const w=act.offsetWidth;el.dataset.w=w;
    let sx=0,sy=0,dx=0,lock=null,lp=null,longDone=false;
    inner.addEventListener('touchstart',e=>{
      const t=e.touches[0];sx=t.clientX;sy=t.clientY;dx=0;lock=null;longDone=false;
      if(swOpen&&swOpen!==el){swOpen.querySelector('.sw-in').style.transform='';swOpen=null}
      clearTimeout(lp);
      lp=setTimeout(()=>{if(Math.abs(dx)<10&&Math.abs(sy-t.clientY)<10){longDone=true;suppress=true;openCtxSheet(el)}},460);
    },{passive:true});
    inner.addEventListener('touchmove',e=>{
      const t=e.touches[0],ddx=t.clientX-sx,ddy=t.clientY-sy;
      if(!lock)lock=Math.abs(ddx)>Math.abs(ddy)*1.2?'x':'y';
      if(Math.abs(ddx)>9||Math.abs(ddy)>9)clearTimeout(lp);
      if(lock!=='x')return;
      dx=ddx;const base=el===swOpen?-w:0;
      let v=base+dx;if(v>0)v=v*.28;if(v<-w-30)v=-w-30+(v+w+30)*.22;
      inner.style.transition='none';inner.style.transform=`translateX(${v}px)`;
      if(e.cancelable&&v<0)e.preventDefault();
    },{passive:false});
    inner.addEventListener('touchend',()=>{
      clearTimeout(lp);inner.style.transition='';
      if(longDone){dx=0;return}
      if(dx<-42){inner.style.transform=`translateX(-${w}px)`;swOpen=el;suppress=true;setTimeout(()=>suppress=false,120)}
      else{inner.style.transform='';if(swOpen===el)swOpen=null}
      dx=0;
    });
    inner.addEventListener('touchcancel',()=>{clearTimeout(lp);inner.style.transition='';inner.style.transform='';dx=0});
  });
}
document.addEventListener('touchstart',e=>{if(swOpen&&!e.target.closest('.sw')){
  swOpen.querySelector('.sw-in').style.transform='';swOpen=null}},{passive:true});

      e2.onmouseenter=()=>{cmdSel=+e2.dataset.i;draw()};
      e2.onclick=()=>runCmd();
    });
    const s=$('#cmdList .cmdk-i.sel');if(s)s.scrollIntoView({block:'nearest'});
  };
  inp.oninput=()=>{cmdSel=0;draw()};
  inp.onkeydown=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();cmdSel=Math.min(cmdItems.length-1,cmdSel+1);draw()}
    else if(e.key==='ArrowUp'){e.preventDefault();cmdSel=Math.max(0,cmdSel-1);draw()}
    else if(e.key==='Enter'){e.preventDefault();runCmd()}
    else if(e.key==='Escape'){closeCmd();popHist()}
  };
  window.__cmdDraw=draw;
  draw();setTimeout(()=>inp.focus(),60);
  function runCmd(){const it=cmdItems[cmdSel];closeCmd();popHist();if(it)setTimeout(it.run,120)}
  el.addEventListener('click',e=>{if(e.target===el){closeCmd();popHist()}});
}

/* ==================== UX: ЖЕСТЫ ПЕРЕКЛЮЧЕНИЯ ==================== */
(function(){
  const sc=$('#scroll'),vw=$('#view');
  let sx=0,sy=0,dx=0,lock=null,edge=false,act=false;
  sc.addEventListener('touchstart',e=>{
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;dx=0;lock=null;act=false;
    edge=t.clientX<26;
    if(e.target.closest('.sw,.gscroll,.sscroll,.chips,.seg,.cal-grid,input,textarea')){act=false;return}
    act=true;
  },{passive:true});
  sc.addEventListener('touchmove',e=>{
    if(!act)return;const t=e.touches[0],ddx=t.clientX-sx,ddy=t.clientY-sy;
    if(!lock)lock=Math.abs(ddx)>Math.abs(ddy)*1.4?'x':'y';
    if(lock!=='x')return;
    dx=ddx;
    if(edge){if(dx>50){closeTop(false);act=false;dx=0}return}
    const lim=80;let v=dx;if(Math.abs(v)>lim)v=Math.sign(v)*(lim+(Math.abs(v)-lim)*.25);
    vw.style.transition='none';vw.style.transform=`translateX(${v*.4}px)`;vw.style.opacity=String(1-Math.min(.35,Math.abs(v)/300));
    if(dx>0&&NAV.length===0){vw.style.transform='';vw.style.opacity=''}
  },{passive:true});
  sc.addEventListener('touchend',()=>{
    vw.style.transition='';vw.style.transform='';vw.style.opacity='';
    if(act&&!edge&&Math.abs(dx)>80){
      const i=VIEWS.findIndex(v=>v.id===S.view);
      if(dx<0&&i<VIEWS.length-1)go(VIEWS[i+1].id);
      else if(dx>0&&i>0)go(VIEWS[i-1].id);
    }
    act=false;dx=0;
  },{passive:true});
})();

/* ==================== ГРАФИК ==================== */

      <button class="chip ${S.gshift==='2'?'on':''}" data-act="gs" data-k="2"><span class="cd" style="background:${SHIFT[2].c}"></span>Ночь · ${nn.length}</button>

  </div>
  <div class="sec-h"><span>Табель · с ${fmtD(ws)}</span><span>нажмите на ячейку дня</span></div>
  <div class="scard">${hwrap(`<div class="sscroll"><table class="sch" style="min-width:${days.length*38+124}px">
    <thead><tr><th class="nm"></th>${days.map(d=>`<th class="dh ${d===S.date?'td':''}">${WD[wdOf(d)]}<b>${parts(d).d}.${String(parts(d).m).padStart(2,'0')}</b></th>`).join('')}</tr></thead>

      ${days.map(d=>{const k=dayCode(p,d),v=CD[k];

          style="background:${hexA(v.c,d===S.date?1:.8)};color:${v.dark?'#3a2e00':'#fff'}" title="${v.l}">${v.m}</div></td>`}).join('')}</tr>`).join('')}

function sheetCell(mn,shift){
  const m=M(mn),z=ZONES[m.z],a=A(),pid=a[mn][shift],p=pid?P(pid):null;
  const ed=can('plan.write',{shift,zone:m.z});
  /* рекомендательная сортировка: свой участок + эта смена + минимум загрузки */
  const scored=PEOPLE.map(c=>{
    const v=validateAssign(c.id,mn,shift),load=assignedTo(c.id,shift,S.date).length;
    let sc=0;
    if(v.ok&&!v.warn)sc+=100;else if(v.ok)sc+=60;
    if(c.z===m.z)sc+=30;
    if(dayShift(c.id,S.date)===shift)sc+=20;
    sc-=load*12;
    if(marker(c.id)==='cross')sc-=6;
    return {c,v,load,sc,ok:v.ok&&!v.warn,warn:v.ok&&v.warn};
  }).sort((x,y)=>y.sc-x.sc);
  const good=scored.filter(x=>x.ok),warn=scored.filter(x=>x.warn),bad=scored.filter(x=>!x.ok&&!x.warn);
  const cand=x=>{const c=x.c,cd=CD[dayCode(c,S.date)],cur=a[mn][shift]===c.id;
    const dis=!(x.ok||x.warn)||!ed;
    return `<div class="opt ${cur?'sel':''} ${x.warn?'rec':''} ${dis?'dis':''}" data-s="${esc((c.n+' '+c.r+' '+z.n+' '+GR[c.gr].n).toLowerCase())}"
      ${ed&&!dis?`data-act="assign" data-m="${mn}" data-s="${shift}" data-p="${c.id}"`:''}>
      <span class="sw-mk" style="background:${hexA(cd.c,.16)};display:grid;place-items:center;color:${cd.dark?'#8a6d00':cd.c};font-size:9.5px;font-weight:800">${cd.m}</span>
      <span class="ot"><b>${esc(c.n)} ${cur?'· назначен':''}</b>
        <small>${esc(c.r)} · ${z.s} · ${GR[c.gr].s} · ${x.load?x.load+' станк(а) в смене':'свободен'}${!x.ok?' — '+x.v.why:''}</small></span>
      ${x.ok&&!cur?'<span class="rec-b">подходит</span>':''}
      ${dis?`<span class="lk">${sv('lock',10,2.6)}</span>`:(x.warn?`<span class="pill" style="background:${hexA('#FF9500',.15)};color:var(--orange)">⚠</span>`:'')}
    </div>`};
  openSheet({t:`Станок ${mn} · ${SHIFT[shift].n.toLowerCase()}`,s:`${fmtD(S.date,'full')} · ${SHIFT[shift].t} · ${z.n}`,body:`
    <div class="note" style="background:${hexA(z.c,.10)}"><span class="ic" style="color:${z.c}">${sv(m.st==='maint'?'wrench':'cpu',17,2.2)}</span>
    <p><b>${esc(m.j)}</b> · ${MST[m.st].l}${m.st==='maint'?' — назначение заданий заблокировано':''}</p></div>
    ${p?`<div class="fl">Текущий исполнитель</div>
      <div class="opt" data-act="person" data-p="${p.id}">
        <span class="sw-mk" style="background:${hexA(z.c,.16)};display:grid;place-items:center;color:${z.c};font-size:11px;font-weight:800">${p.n[0]}</span>
        <span class="ot"><b>${esc(p.n)}</b><small>${esc(p.r)} · ${esc(p.rz)} · ${GR[p.gr].s} · ${CD[dayCode(p,S.date)].l}</small></span>${sv('chev',15,2.4)}</div>
      ${ed?`<button class="btn gray" data-act="unassign" data-m="${mn}" data-s="${shift}" style="margin-bottom:6px">Снять со станка</button>`:''}`
      :`<div class="note" style="background:${hexA('#FF9500',.12)}"><span class="ic" style="color:var(--orange)">${sv('alert',17,2.2)}</span>
        <p>На станке <b>${mn}</b> в ${SHIFT[shift].n.toLowerCase()} смену ${fmtD(S.date,'short')} нет исполнителя. ${ed?'Выберите работника — первыми показаны те, кто подходит по графику и участку.':'Назначение выполнит '+WHO['plan.write']+'.'}</p></div>`}
    ${ed?`<div class="searchbar" style="margin:12px 0 4px">${sv('search',15,2)}<input id="cs" type="search" placeholder="Поиск: фамилия, должность, участок"></div>`:''}
    ${good.length?`<div class="fl">Рекомендуем · ${good.length}<span style="text-transform:none;letter-spacing:0;font-weight:600;color:var(--label3)">по графику и загрузке</span></div>
      <div id="cands">${good.map(cand).join('')}</div>`:''}
    ${warn.length?`<div class="fl">С предупреждением · ${warn.length}</div><div id="cands2">${warn.map(cand).join('')}</div>`:''}
    ${bad.length?`<div class="fl">Недоступны в эту смену · ${bad.length}<span style="text-transform:none;letter-spacing:0;font-weight:600;color:var(--label3)">причина указана</span></div>
      <div id="cands3">${bad.map(cand).join('')}</div>`:''}
    <div class="fl">Задания на станке</div>
    ${S.tasks.filter(t=>t.m===mn).map(t=>`<div class="opt" data-act="task" data-t="${t.id}">

    foot:`<button class="btn gray" data-act="close">Закрыть</button>${!ed?'<button class="btn" data-act="req-new">Запросить правку</button>':''}`,
    mount(){const cs=$('#cs');if(cs)cs.oninput=e=>{const q=e.target.value.toLowerCase();
      ['cands','cands2','cands3'].forEach(id=>{const box=document.getElementById(id);if(!box)return;
        [...box.querySelectorAll('.opt')].forEach(o=>o.style.display=o.dataset.s.includes(q)?'':'none')})};cs&&cs.focus()}});
}
